name: offload-dev

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: offload
      POSTGRES_PASSWORD: offload
      POSTGRES_DB: offload
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offload -d offload"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev:
